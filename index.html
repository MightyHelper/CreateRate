<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101411">
    <title>CreateRate</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="src/ui.css">
  </head>
  <body>
    <main>
      <div class="canvas-menu">
        <button id="menu-toggle" class="canvas-menu-toggle" type="button" aria-label="Open canvas menu" aria-expanded="false" aria-controls="canvas-menu-items">☰</button>
        <nav id="canvas-menu-items" class="canvas-menu-items" aria-label="Canvas actions" hidden>
          <button id="fit-view" type="button">Fit view</button>
          <button id="reset-plant" type="button">Reset</button>
          <button id="export-full" type="button">Export full</button>
          <button id="export-graph" type="button">Export graph</button>
          <button id="import-plant" type="button">Import</button>
        </nav>
      </div>
      <svg id="plant-canvas" aria-label="Production plant canvas" role="application">
        <defs>
          <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="1" fill="#303932"></circle>
          </pattern>
          <marker id="arrowhead" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto">
            <path d="M0,0 L5,2.5 L0,5 z" fill="context-stroke"></path>
          </marker>
        </defs>
        <defs id="machine-model-defs"></defs>
        <rect id="canvas-background" x="0" y="0" width="100%" height="100%" fill="url(#grid)"></rect>
        <g id="world"></g>
        <g id="interaction-preview" aria-hidden="true"></g>
        <rect id="marquee" hidden rx="3"></rect>
      </svg>
      <section id="empty-hint" class="empty-hint">
        <p>Double-tap empty space to add a process. Shift-double-tap to add an item source or sink. Double-tap a resource square to use or produce its item.</p>
      </section>
      <aside id="selection-info" class="selection-info" hidden>
        <span id="selection-label"></span>
        <div id="selection-controls" class="selection-controls"></div>
        <button id="delete-selected" type="button" hidden>Delete</button>
      </aside>
      <aside id="gesture-help" class="gesture-help" aria-label="Available actions" aria-live="polite"></aside>
      <aside id="tag-preview" class="tag-preview" popover="manual" aria-hidden="true"></aside>
      <output id="status" class="status" aria-live="polite">Ready</output>
    </main>
    <dialog id="recipe-picker" class="recipe-picker">
      <form method="dialog" class="picker-form">
        <header><strong id="picker-title">Choose a recipe</strong><button value="cancel" aria-label="Close">×</button></header>
        <input id="recipe-search" type="search" placeholder="Search recipes or items" autocomplete="off">
        <div class="recipe-picker-body">
          <div id="recipe-options" class="recipe-options"></div>
          <aside id="recipe-preview" class="recipe-preview"><p>Hover or focus a recipe to preview it.</p></aside>
        </div>
      </form>
    </dialog>
    <dialog id="item-picker" class="recipe-picker">
      <form method="dialog" class="picker-form">
        <header><strong>Add item source or sink</strong><button value="cancel" aria-label="Close">×</button></header>
        <input id="item-search" type="search" placeholder="Search items" autocomplete="off">
        <div id="item-options" class="recipe-options"></div>
      </form>
    </dialog>
    <dialog id="constraint-editor" class="constraint-editor">
      <form id="constraint-form" class="constraint-form">
        <header><strong id="constraint-title">Configure constraint</strong><button id="constraint-close" type="button" aria-label="Close">×</button></header>
        <div id="constraint-rate-units" class="constraint-rate-units" hidden>
          <label id="constraint-amount-label">Amount <select id="constraint-amount-unit"></select><span id="constraint-fluid-unit" hidden>mB</span></label>
          <label id="constraint-period-label">Per <select id="constraint-period-unit"></select></label>
        </div>
        <label>Equal to <span class="constraint-input"><input id="constraint-equals" type="number" min="0" step="any"><span id="constraint-unit-equals"></span></span></label>
        <label>Greater than or equal to (GEQ) <span class="constraint-input"><input id="constraint-minimum" type="number" min="0" step="any"><span id="constraint-unit-minimum"></span></span></label>
        <label>Less than or equal to (LEQ) <span class="constraint-input"><input id="constraint-maximum" type="number" min="0" step="any"><span id="constraint-unit-maximum"></span></span></label>
        <label class="constraint-check"><input id="constraint-integer" type="checkbox"> Integer</label>
        <label class="constraint-check"><input id="constraint-power-two" type="checkbox"> Power of two</label>
        <p class="constraint-error" id="constraint-error" hidden></p>
        <footer><button id="constraint-clear" type="button">Clear</button><span></span><button id="constraint-apply" type="button">Apply</button></footer>
      </form>
    </dialog>
    <script type="module" src="build/ui.js"></script>
  </body>
</html>
